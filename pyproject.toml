[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aratoken"
version = "1.0.0"
description = "AraToken: Arabic tokenization with a normalization pipeline and the Language Extension Pipeline (LEP) for Qwen3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mark Kashirskiy" },
  { name = "Artiom Lipinski" },
  { name = "Ilya Makarov" },
]
dependencies = [
  "torch==2.5.1",
  "transformers==4.51.3",
  "tokenizers==0.21.4",
  "sentencepiece==0.2.0",
  "datasets==3.6.0",
  "huggingface-hub==0.36.2",
  "accelerate==1.6.0",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "numpy==2.2.6",
  "scikit-learn>=1.5",
  "pyarrow>=18",
  "tqdm",
  "protobuf",
]

[project.optional-dependencies]
eval = ["datasketch>=1.6", "camel-tools>=1.5", "peft>=0.13"]
paper = ["matplotlib>=3.9", "arabic-reshaper>=3.0", "python-bidi>=0.4"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["aratoken"]
