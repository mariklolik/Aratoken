seed: 1

model_path: models/qwen3-0.6b-fw2hq-alif-preserve-150k-hybrid
tokenizer_path: tokenizers/extended/fw2hq-alif-preserve-150k
data_path: data/pretokenized/fw2hq-alif-preserve

freeze_old_embeddings: true
train_embeddings: false
include_lm_head_freeze: true
unfreeze_transformer_layers: [24, 25, 26, 27]
lora_rank: 0
lora_alpha: 32
resume: false

training:
  output_dir: ${hydra:run.dir}/model
  learning_rate: 2e-4
  lr_scheduler_type: linear
  warmup_ratio: 0.1
  weight_decay: 0.01
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 6
  gradient_checkpointing: true
  max_steps: 2000
  bf16: true
  dataloader_num_workers: 8
  dataloader_drop_last: false
  eval_strategy: steps
  eval_steps: 125
  logging_strategy: steps
  logging_steps: 50
  logging_dir: ${hydra:run.dir}/tb
  report_to: tensorboard
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
